# Build and test VIctory-RDNA and Belobug with Kalaga's picked upstream PRs
# (patches/rdna, patches/belobug) on a Windows machine, so a patch that
# breaks the build or a test is found before anyone sits down to play.
#
# Per runtime, three legs:
#   patched  - the pinned base (patches/<runtime>/UPSTREAM.toml) + the series.
#              Must pass.
#   bare     - the pinned base alone. Tells a test our patches broke from one
#              that fails on a hosted runner anyway.
#   latest   - upstream's newest commit + the series: early warning that
#              upstream moved under a patch. Allowed to fail.
#   gnu      - the pinned base + the series, built the way the PC builds it
#              (README: Rust 1.98.1 GNU + mingw-w64, no Visual Studio). Build
#              only. Must pass.
# No GPU here: upstream's GPU tests skip without one, as in upstream's own CI.
name: Runtimes

on:
  push:
    branches: [main]
    paths:
      - "patches/rdna/**"
      - "patches/belobug/**"
      - "patches/*/KNOWN-FAILING.txt"
      - "kalaga/upstream.py"
      - "kalaga/candidates.py"
      - ".github/workflows/runtimes.yml"
  schedule:
    - cron: "17 9 * * *" # daily, ~4 am New York: catches upstream drift
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: runtimes-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  kalaga-tests:
    name: Kalaga tests
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m unittest discover -s tests -v

  # New PRs in the repos we pick from, tried on top of our patched series:
  # which apply cleanly (worth a build), which conflict, which we have.
  # Report only; never fails the run. The daily watch reads its summary.
  candidates:
    name: candidates (${{ matrix.runtime }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        runtime: [rdna, belobug]
    steps:
      - uses: actions/checkout@v5
        with:
          path: kalaga
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Patched runtime
        run: |
          meta=kalaga/patches/${{ matrix.runtime }}/UPSTREAM.toml
          repo=$(sed -n 's/^repo *= *"\(.*\)"/\1/p' $meta)
          commit=$(sed -n 's/^commit *= *"\(.*\)"/\1/p' $meta)
          git init -q runtime
          git -C runtime config core.autocrlf false
          git -C runtime fetch -q --depth 1 "$repo" "$commit"
          git -C runtime checkout -q FETCH_HEAD
          cd kalaga && python -m kalaga patches --runtime ${{ matrix.runtime }} --dir ../runtime --strict > /dev/null
      - name: Try new upstream PRs
        working-directory: kalaga
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python -m kalaga candidates --runtime ${{ matrix.runtime }} --dir ../runtime --days 3 --summary "$GITHUB_STEP_SUMMARY"

  runtime:
    name: ${{ matrix.runtime }} (${{ matrix.leg }})
    runs-on: windows-latest
    timeout-minutes: 120
    continue-on-error: ${{ matrix.leg == 'bare' || matrix.leg == 'latest' }}
    strategy:
      fail-fast: false
      matrix:
        runtime: [rdna, belobug]
        leg: [patched, bare, latest, gnu]
    steps:
      - uses: actions/checkout@v5
        with:
          path: kalaga
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch the runtime
        shell: pwsh
        run: |
          $meta = Get-Content "kalaga/patches/${{ matrix.runtime }}/UPSTREAM.toml" -Raw
          $repo = [regex]::Match($meta, 'repo\s*=\s*"([^"]+)"').Groups[1].Value
          $branch = [regex]::Match($meta, 'branch\s*=\s*"([^"]+)"').Groups[1].Value
          $commit = [regex]::Match($meta, 'commit\s*=\s*"([^"]+)"').Groups[1].Value
          $ref = if ('${{ matrix.leg }}' -eq 'latest') { $branch } else { $commit }
          git init -q runtime
          # The patches carry LF line ends; Windows' default autocrlf would
          # make every one of them fail to apply.
          git -C runtime config core.autocrlf false
          git -C runtime remote add origin $repo
          git -C runtime fetch -q --depth 1 origin $ref
          if ($LASTEXITCODE -ne 0) { exit 1 }
          git -C runtime checkout -q FETCH_HEAD
          $head = git -C runtime rev-parse HEAD
          "Base: $repo @ $head ($('${{ matrix.leg }}'))" | Tee-Object -Append $env:GITHUB_STEP_SUMMARY

      - name: Apply the picked PRs
        if: matrix.leg != 'bare'
        shell: pwsh
        working-directory: kalaga
        run: |
          $extra = @()
          if ('${{ matrix.leg }}' -in @('patched', 'gnu')) { $extra += '--strict' }
          python -m kalaga patches --runtime ${{ matrix.runtime }} --dir ../runtime --summary $env:GITHUB_STEP_SUMMARY @extra
          exit $LASTEXITCODE

      # The version and components pinned in the runtime's rust-toolchain.toml.
      - name: Rust toolchain
        if: matrix.leg != 'gnu'
        working-directory: runtime
        run: rustup toolchain install

      - name: mingw-w64 (gnu leg)
        id: msys2
        if: matrix.leg == 'gnu'
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: false
          install: mingw-w64-x86_64-gcc
          path-type: inherit

      - name: Rust 1.98.1 GNU (gnu leg)
        if: matrix.leg == 'gnu'
        shell: pwsh
        run: |
          rustup toolchain install 1.98.1-x86_64-pc-windows-gnu --profile minimal
          # The runtime's own msys2 gcc first on PATH, as toolchain_bin does in kalaga.toml.
          "${{ steps.msys2.outputs.msys2-location }}\mingw64\bin" | Out-File -Append -Encoding utf8 $env:GITHUB_PATH

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: runtime
          key: ${{ matrix.runtime }}-${{ matrix.leg }}

      - name: Build victory.exe (release, as Kalaga builds it)
        if: matrix.leg != 'gnu'
        working-directory: runtime
        run: cargo build --locked --release -p victory

      - name: Build victory.exe (GNU, as the PC builds it)
        if: matrix.leg == 'gnu'
        working-directory: runtime
        shell: pwsh
        run: |
          gcc --version | Select-Object -First 1
          cargo +1.98.1-x86_64-pc-windows-gnu build --locked --release -p victory --target x86_64-pc-windows-gnu
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $exe = Get-Item target/x86_64-pc-windows-gnu/release/victory.exe
          "GNU build: victory.exe $([math]::Round($exe.Length / 1MB)) MB" | Tee-Object -Append $env:GITHUB_STEP_SUMMARY

      - name: Tests (default features)
        if: matrix.leg != 'gnu'
        working-directory: runtime
        shell: pwsh
        run: |
          # Upstream tests known to fail on a GPU-less runner, patched or not.
          $skip = @()
          $known = "../kalaga/patches/${{ matrix.runtime }}/KNOWN-FAILING.txt"
          if (Test-Path $known) {
            Get-Content $known | Where-Object { $_ -and -not $_.StartsWith('#') } | ForEach-Object {
              $skip += '--skip'; $skip += $_.Trim()
            }
            if ($skip.Count) { "Skipped as known upstream failures: $(($skip | Where-Object { $_ -ne '--skip' }) -join ', ')" | Tee-Object -Append $env:GITHUB_STEP_SUMMARY }
          }
          cargo test --workspace --locked -- --exact @skip
          exit $LASTEXITCODE

      - name: Clippy (warnings shown, not fatal)
        if: always() && matrix.leg != 'gnu'
        working-directory: runtime
        run: cargo clippy --workspace --all-targets --locked
